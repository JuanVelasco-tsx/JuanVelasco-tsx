name: Generate Contribution Snake

on:
  # Se ejecuta cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta en cada push a main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # color_dots: primer color = celda vacía, luego 4 niveles de contribución
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7E22CE&color_dots=#ebedf0,#e0c3fc,#c084fc,#A855F7,#7E22CE
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#2d2438,#4c1d95,#7C3AED,#A855F7,#C084FC

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
